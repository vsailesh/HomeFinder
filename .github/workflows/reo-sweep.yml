name: REO Sweep

# Daily HomeSteps REO sweep across all served metros. Pings the
# protected backend endpoint; the Render free instance may be asleep,
# so allow for a 50s+ cold start plus a multi-minute cold sweep.
on:
  schedule:
    - cron: "17 13 * * *"   # daily 13:17 UTC (9:17am ET) — off the :00 mark
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend REO sweep
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          SWEEP_TOKEN: ${{ secrets.SWEEP_TOKEN }}
        run: |
          test -n "$BACKEND_URL" && test -n "$SWEEP_TOKEN" \
            || { echo "Set RENDER_BACKEND_URL and SWEEP_TOKEN repo secrets" >&2; exit 1; }
          curl -sS -X POST --fail-with-body \
            --max-time 900 --retry 2 --retry-delay 60 --retry-all-errors \
            -H "X-Sweep-Token: $SWEEP_TOKEN" \
            "$BACKEND_URL/api/reo/sweep"
